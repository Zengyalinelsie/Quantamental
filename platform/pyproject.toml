[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-platform"
version = "0.2.0"
description = "Point-in-time A-share fundamental research and execution platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "fastapi>=0.116,<0.117",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
