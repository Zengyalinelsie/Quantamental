services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a_share_platform_layered_dev
      POSTGRES_USER: a_share_platform_dev
      POSTGRES_PASSWORD: local-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a_share_platform_dev -d a_share_platform_layered_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-store:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  object-data:
